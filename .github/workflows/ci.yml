name: Tests and package smoke checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install --no-deps .
      - run: pymessage --version
      - name: Validate the bundled native decoder on Mac
        if: runner.os == 'macOS'
        run: pymessage --prepare-exporter
      - name: Benchmark smoke and cache regression gates
        run: python -m benchmarks.run --sizes 1000 --quick --output benchmark-smoke.json
      - run: python -c "import json; r=json.load(open('benchmark-smoke.json'))['cases'][0]; assert r['unchanged']['cache']['analyzed']==0; assert r['unchanged']['sync']['snapshot_unchanged']; assert r['first']['total_messages']==1000"
  native-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: python3 native/build.py
      - run: python3 native/collect_licenses.py
      - uses: actions/upload-artifact@v4
        with:
          name: native-decoder-and-source
          path: |
            pymessage/bin/
            pymessage/data/native-licenses/
            native/src/
            native/Cargo.toml
            native/Cargo.lock
            native/LICENSE
            native/README.md
            native/build.py
            native/rust-toolchain.toml
          if-no-files-found: error
